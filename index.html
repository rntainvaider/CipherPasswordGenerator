<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cipher | Generating passwords</title>
  <link rel="stylesheet" href="./assets/css/index.css">
  <link rel="shortcut icon" href="./assets/icons/user-key.svg" type="image/x-icon">
</head>

<body>
  <main class="main">
    <div class="wrapper">
      <div class="header">
        <div class="header__logo">
          <img src="./assets/icons/shield.svg" alt="" class="header__logo-icon">
          <div>
            <h1 class="title">
              Cipher
            </h1>
            <p class="subtitle" data-translate="subtitle">
              кузница паролей · криптослучайно
            </p>
          </div>
        </div>
        <div class="header__languages">
          <svg class="header__languages-icon" viewBox="0 0 24 24">
            <use href="./assets/icons/sprite.svg#languages"></use>
          </svg>
          <button class="header__language-button" data-language="en">
            EN
          </button>
          <button class="header__language-button header__language-button--active" data-language="ru">
            RU
          </button>
        </div>
      </div>
      <section class="password">
        <h2 class="password__label" data-translate="password">
          Ваш пароль
        </h2>
        <div class="password__wrapper">
          <span class="password__text">

          </span>
          <button class="password__copy">
            <svg class="password__copy-icon" viewBox="0 0 24 24">
              <use href="./assets/icons/sprite.svg#copy" class="password__copy-use"></use>
            </svg>
          </button>
        </div>
        <div class="password__length">
          <h2 class="password__label" data-translate="length">
            Длина
          </h2>
          <span class="password__length-number">
            16
          </span>
        </div>
        <input type="range" min="6" max="48" value="16" class="password__range">
        <h2 class="password__label" data-translate="charset">
          Наборы символов
        </h2>
        <div class="group__buttons">
          <button class="group__button">
            Строчные
          </button>
          <button class="group__button">
            Заглавные
          </button>
          <button class="group__button">
            Цифры
          </button>
          <button class="group__button">
            Символы
          </button>
        </div>
        <button class="password__generate">
          Сгенерировать пароль
        </button>
      </section>
    </div>
  </main>

  <script src="./assets/js/switchButtons.js"></script>
  <script src="./assets/js/copy.js"></script>
  <script src="./assets/js/range.js"></script>
  <script src="./assets/js/passwordText.js"></script>
</body>

</html>
